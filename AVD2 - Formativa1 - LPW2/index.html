<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVD2 - Formativa 1</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="cabecalho">
        <h1> Lista de Compras </h1>
        <button>Voltar</button>
    </header>

    <input type="text" id="input-item-novo">
    <button id="botao-adicionar">Adicionar Item</button>

    <ul id="lista-de-compras">
        <li>
            <input type="checkbox">
            <span>Arroz</span>
            <button>🗑️</button>
        </li>

        <li>
            <input type="checkbox">
            <span>Feijão</span>
            <button>🗑️</button>
        </li>

        <li>
            <input type="checkbox">
            <span>Leite</span>
            <button>🗑️</button>
        </li>

    </ul>

    <!-- Mensagem de remoção de produto na parte inferior da tela -->
    <div id="notificacao">
        Item removido com sucesso!
        <button id="botao-X">
            X
        </button>
    </div>

    <script src="script.js"></script>
</body>

</html>
