<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PartiuFoa | Cadastro</title>

    <link rel="shortcut icon" href="assents/icon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <header>
    </header>

    <main>

        <div class="card-principal">
            <a href="">
                <img src="assents/icon/android-chrome-192x192.png" alt="Logo PartiuFOA" class="logo">
            </a>
            <h1>Criar Conta</h1>
        </div>

        <form action="" id="formulario-cadastro">

            <div class="campo">
                <label for="nome">Nome Completo</label>
                <div class="caixa-input">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="nome" placeholder="Digite seu nome completo">
                </div>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <div class="caixa-input">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="seu.email@unifoa.edu.br">
                </div>
            </div>

            <div class="campo">
                <label for="matricula">Matrícula</label>
                <div class="caixa-input">
                    <i class="fa-solid fa-id-card"></i>
                    <input type="text" id="matricula" placeholder="Número da sua matrícula">
                </div>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <div class="caixa-input">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="senha" placeholder="Crie sua senha">
                    <i class="fa-solid fa-eye-slash icone-olho"></i>
                </div>
            </div>

            <div class="campo">
                <label for="confirmar-senha">Confirmar Senha</label>
                <div class="caixa-input">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="confirmar-senha" placeholder="Repita sua senha">
                    <i class="fa-solid fa-eye-slash icone-olho"></i>
                </div>
            </div>

            <div class="termos">
                <input type="checkbox" id="termos">
                <label for="termos">
                    Li e concordo com os <a href="#">Termos de Uso</a> e <a href="#">Política de Privacidade</a>.
                </label>
            </div>

            <div class="botoes">
                <input type="submit" value="Cadastrar" class="botao-cadastrar">
                <p class="link-login">
                    Já tem uma conta? <a href="/index.html">Entrar</a>
                </p>
            </div>

        </form>

    </main>

    <script src="js/cadastro.js"></script>

</body>

</html>
