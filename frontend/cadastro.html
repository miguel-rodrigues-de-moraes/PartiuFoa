<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PartiuFoa | Cadastro</title>

    <link rel="shortcut icon" href="assents/icon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <main class="pagina-cadastro">

        <div class="card-principal">
            <img src="assents/icon/android-chrome-192x192.png" alt="Logo PartiuFOA" class="logo">
            <h1>Criar Conta</h1>
        </div>

        <form action="" id="formulario-cadastro" name="formulario-cadastro">

            <!-- Nome -->

            <div class="campo">
                <label for="nome">Nome Completo</label>
                <div class="caixa-input">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="nome"  placeholder="Digite seu nome completo">
                </div>
            </div>

            <!-- Email -->

            <div class="campo">
                <label for="email">E-mail</label>
                <div class="caixa-input">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="seu.email@unifoa.edu.br">
                </div>
            </div>

            <!-- Matricula -->

            <div class="campo">
                <label for="matricula">Matrícula</label>
                <div class="caixa-input">
                    <i class="fa-solid fa-id-card"></i>
                    <input type="text" id="matricula" maxlength="9" placeholder="Número da sua matrícula">
                </div>
            </div>

            <!-- Senha -->

            <div class="campo">
                <label for="senha">Senha</label>
                <div class="caixa-input">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" class="caixa-senha" id="senha" placeholder="Crie sua senha">

                    <button type="button" class="botao-olho">
                        <i class="fa-solid fa-eye-slash icone-olho"></i>
                    </button>
                </div>
            </div>

            <!-- Confirmar Senha -->

            <div class="campo">
                <label for="confirmar-senha">Confirmar Senha</label>
                <div class="caixa-input">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" class="caixa-senha" id="confirmar-senha" placeholder="Repita sua senha">

                    <button type="button" class="botao-olho">
                        <i class="fa-solid fa-eye-slash icone-olho"></i>
                    </button>
                </div>
            </div>

            <div class="termos">
                <input type="checkbox" id="termos">
                <label for="termos">
                    Li e concordo com os <a href="#">Termos de Uso</a> e <a href="#">Política de Privacidade</a>.
                </label>
            </div>

            <div class="botoes">
                <input type="submit" value="Cadastrar" class="botao-cadastrar">
                <p class="link-login">
                    Já tem uma conta? <a href="./home.html">Entrar</a>
                </p>
            </div>

        </form>

        <div id="container-alertas" class="container-alertas"></div>

    </main>

    <script type="module" src="js/cadastro.js"></script>

</body>

</html>
