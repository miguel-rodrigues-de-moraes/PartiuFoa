<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/criarcarona.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="shortcut icon" href="assents/icon/favicon.ico" type="image/x-icon">

    <title>PartiuFoa | Criar Carona</title>
</head>
<body>
    
    <header class="cabecalho">
        <a class="cabecalho-logo" href="home.html" aria-label="Voltar para o início">
            <img class="cabecalho-imagem" src="assents/img/img-header.png" alt="Logo PartiuFoa">
        </a>

        <div class="cabecalho-acoes">
            <a class="cabecalho-botao" href="chat.html" aria-label="Abrir mensagens">
                <i class="fa-regular fa-comment-dots icone-chat"></i>
            </a>

            <button class="cabecalho-botao" type="button" aria-label="Notificações">
                <i class="fa-regular fa-bell icone-sino"></i>
            </button>

            <button class="cabecalho-perfil" type="button" aria-label="Perfil do usuário">
                <a href="perfil.html" class="cabecalho-foto">
                    <img class="cabecalho-foto" src="assents/img/img-perfil.png" alt="Foto de perfil">
                </a>
            </button>
        </div>
    </header>

    <main class="conteudo-principal">

        <div class="voltar-menu">
            <i class="fa-solid fa-arrow-left"></i>
            <a href="home.html">Voltar para o Menu</a>
        </div>
            
        <h1 class="titulo-detalhes-carona">Criar Carona</h1>
    </main>

        <button class="acessibilidade-botao" type="button" aria-label="Abrir acessibilidade">
            <i class="fa-solid fa-wheelchair icone-acessibilidade"></i>
        </button>

</body>
</html>
