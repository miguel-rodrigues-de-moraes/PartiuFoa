<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/carona.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="shortcut icon" href="assents/icon/favicon.ico" type="image/x-icon">

    <title>PartiuFoa | Detalhes da Carona</title>
</head>
<body>

    <header class="cabecalho">
        <a class="cabecalho-logo" href="index.html" aria-label="Voltar para o início">
            <img class="cabecalho-imagem" src="assents/img/img-header.png" alt="Logo PartiuFoa">
        </a>

        <div class="cabecalho-acoes">
            <a class="cabecalho-botao" href="chat.html" aria-label="Abrir mensagens">
                <i class="fa-regular fa-comment-dots icone-chat"></i>
            </a>

            <button class="cabecalho-botao" type="button" aria-label="Notificações">
                <i class="fa-regular fa-bell icone-sino"></i>
            </button>

            <button class="cabecalho-perfil" type="button" aria-label="Perfil do usuário">
                <img class="cabecalho-foto" src="assents/img/img-perfil.png" alt="Foto de perfil">
            </button>
        </div>
    </header>

    <main class="conteudo-principal">

                <div class="voltar-menu">
                    <i class="fa-solid fa-arrow-left"></i>
                    <a href="index.html">Voltar para o Menu</a>
                </div>

            <h1 class="detalhe-carona">Detalhes da Carona</h1>

            <article class="perfil-card">
                    <img class="perfil-foto" src="assents/img/perfil1.png" alt="Foto de Maria Silva">

                    <a href="carona.html" class="perfil-dados">
                        <div class="perfil-cabecalho">
                            <div class="perfil-motorista">Maria Silva</div>
                                <div class="perfil-estrelas" aria-label="5 estrelas">
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star"></i>
                                </div>
                        </div>

                        <p class="perfil-texto">Sistema de Informação - 1º Período</p>
                        
                        <div class="aluno-unifoa">
                            <i class="fa-solid fa-graduation-cap"></i>
                            <p class="aluno-texto">Aluno UniFOA</p>
                        </div>

            </article>            

    </main>

</body>
</html>
