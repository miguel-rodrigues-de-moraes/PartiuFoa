<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/perfil.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="shortcut icon" href="assents/icon/favicon.ico" type="image/x-icon">

    <title>PartiuFoa | Perfil</title>
</head>
<body>
    
    <header class="cabecalho">
        <a class="cabecalho-logo" href="home.html" aria-label="Voltar para o início">
            <img class="cabecalho-imagem" src="assents/img/img-header.png" alt="Logo PartiuFoa">
        </a>

        <div class="cabecalho-acoes">
            <a class="cabecalho-botao" href="chat.html" aria-label="Abrir mensagens">
                <i class="fa-regular fa-comment-dots icone-chat"></i>
            </a>

            <button class="cabecalho-botao" type="button" aria-label="Notificações">
                <i class="fa-regular fa-bell icone-sino"></i>
            </button>

            <button class="cabecalho-perfil" type="button" aria-label="Perfil do usuário">
                <img class="cabecalho-foto" src="assents/img/img-perfil.png" alt="Foto de perfil">
            </button>
        </div>
    </header>

    <main class="conteudo-principal">

        <div class="voltar-menu">
            <i class="fa-solid fa-arrow-left"></i>
            <a href="home.html">Voltar para o Menu</a>
        </div>
            
        <h1 class="titulo-detalhes-carona">Meu Perfil</h1>

    <aside class="layout-carona">
        <article class="painel-informacoes-carona">
                <section class="card-perfil-motorista">
                    <img class="perfil-foto" src="assents/img/perfil1.png" alt="Foto de Maria Silva">
                    <div class="perfil-informacoes">
                        <div class="perfil-cabecalho">
                            <div class="perfil-nome">Maria Silva</div>
                            <div class="perfil-estrelas" aria-label="5 estrelas">
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                            </div>
                        </div>
                        <p class="perfil-curso">Sistema de Informação - 2º Período</p>

                        <div class="aluno-unifoa">
                            <i class="fa-solid fa-graduation-cap"></i>
                            <p class="aluno-unifoa-texto">Aluno UniFOA</p>
                        </div>

                        <div class="aluno-editar">
                            <i class="fa-solid fa-pen"></i>
                            <p class="aluno-editar-texto">Editar Perfil</p>
                        </div>
                    </div>
                </section>
                
                <section class="card">
                    <h1 class="titulo-card">Histórico</h1>
                    <div class="historico-dados">
                        <div class="historico-item-inicial">
                            <i class="fa-solid fa-car historico-icone"></i>
                            <div class="historico-item-textos">
                                <p class="historico-valor">32</p>
                                <p class="historico-legenda">caronas realizadas</p>
                            </div>
                        </div>
                        <div class="historico-item">
                            <i class="fa-solid fa-book historico-icone"></i>
                            <div class="historico-item-textos">
                                <p class="historico-valor">24</p>
                                <p class="historico-legenda">avaliações recebidas</p>
                            </div>
                        </div>
                        <div class="historico-item">
                            <i class="fa-solid fa-star historico-icone"></i>
                            <div class="historico-item-textos">
                                <p class="historico-valor">5</p>
                                <p class="historico-legenda">média das avaliações</p>
                            </div>
                        </div>
                        <div class="historico-item">
                            <i class="fa-regular fa-calendar historico-icone"></i>
                            <div class="historico-item-textos">
                                <p class="historico-legenda">conta há</p>
                                <p class="historico-valor">8 messes</p>
                            </div>
                        </div>
                        <div class="historico-item-conclusao">
                            <i class="fa-solid fa-circle-check historico-icone"></i>
                            <div class="historico-item-textos">
                                <p class="historico-valor">97%</p>
                                <p class="historico-legenda">das caronas concluídas</p>
                            </div>
                        </div>
                    </div>
        </article>

            <article class="painel-solicitacao-carona">
                <section class="card">
                    <h1 class="titulo-card">Dados do Carro</h1>
                </section>
            </article>
    </aside>

        <button class="acessibilidade-botao" type="button" aria-label="Abrir acessibilidade">
            <i class="fa-solid fa-wheelchair icone-acessibilidade"></i>
        </button>

    </main>
</body>
</html>
