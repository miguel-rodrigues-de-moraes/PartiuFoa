<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PartiuFOA | Login</title>

    <link rel="shortcut icon" href="assents/icon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <main class="pagina-login">

        <div class="login-cartao">

            <div class="login-cabecalho">
                <img class="login-logo" src="assents/icon/android-chrome-192x192.png" alt="Logo PartiuFOA">
                <h1 class="login-titulo">Login</h1>
            </div>

            <!-- Formulario de Login -->

            <form class="login-formulario" id="formulario-login">

                <!-- Matrícula -->
                <div class="login-inputs">
                    <label class="login-label" for="campo-matricula">Matrícula</label>

                    <div class="login-caixa-input">
                        <i class="fa-solid fa-id-card"></i>

                        <input class="login-campo" type="text" id="campo-matricula" name="matricula"
                            placeholder="Ex: 202600000" maxlength="9" pattern="[0-9]{9}"
                            title="A matrícula deve conter exatamente 9 números." required>
                    
                    </div>
                </div>

                <!-- Senha -->
                <div class="login-inputs">
                    <label class="login-label" for="campo-senha">Senha</label>

                    <div class="login-caixa-input">
                        <i class="fa-solid fa-lock"></i>

                        <input type="password" class="login-campo" id="campo-senha" name="senha"
                            placeholder="Ex: Senha123!" minlength="8" maxlength="16"
                            title="A senha deve ter entre 8 a 16 caractéres." required>

                        <button class="login-olho" type="button" id="botao-olho">
                            <i class="fa-solid fa-eye-slash icone-olho"></i>
                        </button>
                    </div>
                </div>

                <!-- Esqueceu a Senha -->
                <div class="login-recuperar">
                    <a class="login-link" href="#">Esqueceu a senha?</a>
                </div>

                <!-- Botao Entrar -->
                <div>
                    <button class="login-botao" type="submit">Entrar</button>
                </div>

            </form>

            <div class="login-cadastro">
                <p class="login-texto">Não possui conta?</p>
                <a class="login-link" href="cadastro.html">Cadastre-se aqui!</a>
            </div>
        </div>

    </main>

    <script src="js/login.js"></script>
</body>

</html>
